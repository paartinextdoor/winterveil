<body>
  <canvas id="snow" aria-hidden="true"></canvas>

  <div class="app">
    <main id="view" class="view" tabindex="-1" aria-live="polite">
      <div class="boot">
        <div class="boot__emblem" aria-hidden="true"></div>
        <p>Preparing your research…</p>
      </div>
    </main>

    <nav class="tabbar" aria-label="Main">
      <a class="tabbar__item" href="#/home" data-tab="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.6 12 4l8.5 6.6V19a1.5 1.5 0 0 1-1.5 1.5h-4v-6h-6v6H5A1.5 1.5 0 0 1 3.5 19z"/></svg>
        <span>Home</span>
      </a>
      <a class="tabbar__item" href="#/dex" data-tab="dex">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h5.2M15.3 12h5.2"/><circle cx="12" cy="12" r="2.8"/></svg>
        <span>Pokédex</span>
      </a>
      <a class="tabbar__item" href="#/gift" data-tab="gift">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="9" width="17" height="11.5" rx="2"/><path d="M2.5 9h19M12 9v11.5M12 9c-1.5-3.5-5.5-4.5-6-2s3.5 2 6 2c2.5 0 6.5.5 6-2s-4.5-1.5-6 2"/></svg>
        <span>Mystery Gift</span>
        <i class="tabbar__dot" hidden></i>
      </a>
      <a class="tabbar__item" href="#/achievements" data-tab="achievements">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 4h9v5a4.5 4.5 0 0 1-9 0zM7.5 6H4.5a3 3 0 0 0 3 3.5M16.5 6h3a3 3 0 0 1-3 3.5M12 13.5V17M8.5 20.5h7M9.5 17h5"/></svg>
        <span>Achievements</span>
      </a>
    </nav>
  </div>

  <div id="overlay-root"></div>
  <div id="toast-root" aria-live="assertive"></div>

  <script type="module" src="js/main.js"></script>
